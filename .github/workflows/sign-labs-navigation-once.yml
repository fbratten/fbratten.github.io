name: One-time signed Labs navigation transfer
on:
  push:
    branches:
      - chatgpt/labs-nav-signing-bridge-20261017
permissions:
  contents: write
concurrency:
  group: signed-labs-nav-20261017
  cancel-in-progress: false
jobs:
  sign-exact-navigation-content:
    if: github.repository == 'fbratten/fbratten.github.io' && github.ref == 'refs/heads/chatgpt/labs-nav-signing-bridge-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged navigation change
        uses: actions/checkout@v4
        with:
          ref: a9eb3b1158a52247bedc4f0e3ddf3af9a7947230
          persist-credentials: false
      - name: GitHub-signed exact tree on isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, subprocess, urllib.request, time
          from pathlib import Path
          
          repo = "fbratten/fbratten.github.io"
          source_commit = "a9eb3b1158a52247bedc4f0e3ddf3af9a7947230"
          source_tree = "e8c10da28105f6f8d28d3ea2b900a4e01fc95bda"
          base_commit = "c500a6ebdafbc8c0190c47475f1556fae5440490"
          target_branch = "chatgpt/labs-nav-unified-signed-20261017"
          bridge_ref = "refs/heads/chatgpt/labs-nav-signing-bridge-20261017"
          files = ["methods/index.html","labs/index.html","index.html",
                   "tests/navigation_page.mjs","tests/navigation_contract.py"]
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == bridge_ref
          assert git("rev-parse", "HEAD") == source_commit
          assert git("rev-parse", "HEAD^{tree}") == source_tree
          assert len(files) == len(set(files)) == 5
          additions = [{"path": path, "contents": base64.b64encode(Path(path).read_bytes()).decode("ascii")}
                       for path in files]
          mutation = "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}"
          payload = {"query": mutation, "variables": {"input": {
              "branch": {"repositoryNameWithOwner": repo, "branchName": target_branch},
              "message": {"headline": "Fix navigation to discover all labs from Methods and home",
                          "body": "Exact staged tree from isolated nav repair. No old lab removed; GitHub-signed commit."},
              "expectedHeadOid": base_commit,
              "fileChanges": {"additions": additions}
          }}}
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request("https://api.github.com/graphql",
              data=json.dumps(payload).encode("utf-8"), method="POST",
              headers={"Authorization": "Bearer " + token,
                       "Content-Type": "application/json",
                       "User-Agent": "signed-navigation-repair"})
          with urllib.request.urlopen(request, timeout=90) as response:
              result=json.load(response)
          if result.get("errors") or not result.get("data",{}).get("createCommitOnBranch"):
              raise RuntimeError("Signature operation unavailable: "+str(result.get("errors", result)))
          sha = result["data"]["createCommitOnBranch"]["commit"]["oid"]
          
          def get(url):
              req=urllib.request.Request(url, headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"signed-navigation-repair"})
              with urllib.request.urlopen(req,timeout=35) as res: return json.load(res)
          
          for retry in range(8):
              commit=get("https://api.github.com/repos/"+repo+"/commits/"+sha)
              if commit.get("commit",{}).get("verification",{}).get("verified"):break
              time.sleep(2)
          assert commit["commit"]["verification"]["verified"],"Unsigned commit: "+str(commit["commit"]["verification"])
          assert commit["commit"]["tree"]["sha"]==source_tree,"Tree differs from staged content"
          assert [p["sha"] for p in commit["parents"]]==[base_commit],"Unexpected parent"
          changed={item["filename"]:item["status"] for item in commit["files"]}
          assert set(changed)==set(files),"Unexpected changed paths"
          assert all(x=="modified" for x in changed.values()),"Removal, add or rename detected"
          print("PASS: GitHub valid signature, exact source tree, exact base, 5 modified files, no lost files, no main write:",sha)
          
          PY
