name: One-time signed Labs navigation single-commit re-creation
on:
  push:
    branches:
      - chatgpt/labs-nav-signing-bridge-20261017
permissions:
  contents: write
concurrency:
  group: signed-labs-nav-single-20261017
  cancel-in-progress: false
jobs:
  publish-signed-exact-tree:
    if: github.repository == 'fbratten/fbratten.github.io' && github.ref == 'refs/heads/chatgpt/labs-nav-signing-bridge-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact already verified source tree
        uses: actions/checkout@v4
        with:
          ref: db485f09432665aa648d4373fbed1cb71f6a61ce
          persist-credentials: false
      - name: GitHub sign unchanged six-file source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,subprocess,urllib.request,time
          from pathlib import Path
          repo="fbratten/fbratten.github.io"
          source="db485f09432665aa648d4373fbed1cb71f6a61ce"
          source_tree="1ef3cb33aed9b73a6d5e971cf7439dd406b2a815"
          base="c500a6ebdafbc8c0190c47475f1556fae5440490"
          target="chatgpt/labs-nav-single-signed-20261017"
          bridge="refs/heads/chatgpt/labs-nav-signing-bridge-20261017"
          paths=["index.html","labs/index.html","methods/index.html",
                 "tests/navigation_contract.py","tests/navigation_page.mjs","tests/site_copy_and_canvas_lint.py"]
          assert os.environ["GITHUB_REPOSITORY"]==repo and os.environ["GITHUB_REF"]==bridge
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==source
          assert subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()==source_tree
          assert len(set(paths))==len(paths)==6
          additions=[{"path":p,"contents":base64.b64encode(Path(p).read_bytes()).decode("ascii")} for p in paths]
          payload={"query":"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}","variables":{"input":{
            "branch":{"repositoryNameWithOwner":repo,"branchName":target},
            "message":{"headline":"Unify Labs directory and Mutation Gate navigation",
                       "body":"GitHub-signed re-creation of the exact verified and tested source tree. Preserves all previous commits and branches."},
            "expectedHeadOid":base,
            "fileChanges":{"additions":additions}
          }}}
          token=os.environ["GH_TOKEN"]
          def query(url,body=None):
            headers={"Authorization":"Bearer "+token,"User-Agent":"signed-lab-navigation-single-commit",
                     "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
            if body is not None:headers["Content-Type"]="application/json"
            request=urllib.request.Request(url,method="POST" if body is not None else "GET",
                   data=json.dumps(body).encode() if body is not None else None,headers=headers)
            with urllib.request.urlopen(request,timeout=90) as resp:
              data=resp.read()
              return json.loads(data) if data else None
          res=query("https://api.github.com/graphql",payload)
          if res.get("errors") or not res.get("data",{}).get("createCommitOnBranch"):
            raise RuntimeError("Signed commit not created: "+str(res.get("errors",res)))
          sha=res["data"]["createCommitOnBranch"]["commit"]["oid"]
          for t in range(8):
            c=query("https://api.github.com/repos/"+repo+"/commits/"+sha)
            if c.get("commit",{}).get("verification",{}).get("verified"):break
            time.sleep(2)
          assert c["commit"]["verification"]["verified"] is True,"Missing valid signature"
          assert c["commit"]["tree"]["sha"]==source_tree,"Source tree mismatch"
          assert [x["sha"] for x in c["parents"]]==[base],"Incorrect parent"
          actual={f["filename"]:f["status"] for f in c["files"]}
          assert set(actual)==set(paths) and all(status=="modified" for status in actual.values()),"Unexpected path or deletion"
          print("PASS: single GitHub-signed commit with 6 exact verified files, no rewrite or deletion:",sha)
          
          PY
