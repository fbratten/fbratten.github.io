name: One-time verified mutation-gate lab transfer
on:
  push:
    branches:
      - chatgpt/mutation-gate-signing-bridge-20261017
permissions:
  contents: write
concurrency:
  group: signed-mutation-gate-lab-20261017
  cancel-in-progress: false
jobs:
  create-github-signed-commit:
    if: github.repository == 'fbratten/fbratten.github.io' && github.ref == 'refs/heads/chatgpt/mutation-gate-signing-bridge-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact passing PR-46 commit
        uses: actions/checkout@v4
        with:
          ref: f0c63c8d3dfdeaf5055bcb5ec8da91d26ca45dc4
          persist-credentials: false
      - name: Sign and verify exact content on isolated target branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
            import os, json, base64, subprocess, urllib.request, time
            from pathlib import Path
            
            repo = "fbratten/fbratten.github.io"
            source_commit = "f0c63c8d3dfdeaf5055bcb5ec8da91d26ca45dc4"
            source_tree = "d00008cba932bd460d526f04230e5bfab8b18c67"
            base_commit = "cdfafea44048513bf64239ef4ad0e139f0e1b8fc"
            target_branch = "chatgpt/mutation-gate-lab-github-signed-20261017"
            bridge_ref = "refs/heads/chatgpt/mutation-gate-signing-bridge-20261017"
            files = ["all-pages/index.html","labs/ai-evaluation-ci-cd/index.html","labs/ai-testing/glossary-links.js","labs/fault-injection/index.html","labs/index.html","labs/mutation-gate/app.js","labs/mutation-gate/index.html","labs/mutation-gate/model.js","labs/mutation-gate/styles.css","labs/testing-architecture/index.html","scripts/build_navigation.py","sitemap.xml","tests/ai_testing_labs.mjs"]
            
            def git(*args):
                return subprocess.check_output(["git", *args], text=True).strip()
            assert os.environ["GITHUB_REPOSITORY"] == repo
            assert os.environ["GITHUB_REF"] == bridge_ref
            assert git("rev-parse", "HEAD") == source_commit
            assert git("rev-parse", "HEAD^{tree}") == source_tree
            additions = [
                {"path": path, "contents": base64.b64encode(Path(path).read_bytes()).decode("ascii")}
                for path in files
            ]
            assert len(files) == len(set(files)) == 13
            assert all(not entry["path"].startswith("/") for entry in additions)
            mutation = "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}"
            body = {
                "query": mutation,
                "variables": {
                    "input": {
                        "branch": {"repositoryNameWithOwner": repo, "branchName": target_branch},
                        "message": {
                            "headline": "Add verified Mutation Gate Lab and glossary deep links",
                            "body": "Exact tested content from PR #46, CI run 39068746169. Signed via GitHub GraphQL createCommitOnBranch. Original branches and commits preserved."
                        },
                        "expectedHeadOid": base_commit,
                        "fileChanges": {"additions": additions}
                    }
                }
            }
            token = os.environ["GH_TOKEN"]
            def get(url):
                request = urllib.request.Request(url, headers={
                    "Authorization": "Bearer " + token,
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "controlled-signed-lab-transfer"
                })
                with urllib.request.urlopen(request, timeout=30) as response:
                    return json.load(response)
            
            req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps(body).encode(),
                headers={"Authorization": "Bearer " + token, "Content-Type": "application/json",
                         "User-Agent": "controlled-signed-lab-transfer"}, method="POST")
            with urllib.request.urlopen(req, timeout=60) as response:
                result = json.load(response)
            if result.get("errors") or not result.get("data", {}).get("createCommitOnBranch"):
                raise RuntimeError("GraphQL signing operation failed: "+str(result.get("errors", result)))
            sha = result["data"]["createCommitOnBranch"]["commit"]["oid"]
            print("Signed commit proposed:",sha)
            # GitHub REST readback is authoritative; do not infer success from the GraphQL response alone.
            for attempt in range(8):
                c = get("https://api.github.com/repos/"+repo+"/commits/"+sha)
                if c.get("commit", {}).get("verification", {}).get("verified"):
                    break
                time.sleep(2)
            verification = c["commit"]["verification"]
            assert verification.get("verified") is True, "Commit not GitHub-verified: "+str(verification.get("reason"))
            assert c["commit"]["tree"]["sha"] == source_tree, "Tree differs from tested source"
            assert [x["sha"] for x in c["parents"]] == [base_commit], "Unexpected parent"
            changed = {f["filename"]: f["status"] for f in c["files"]}
            assert set(changed) == set(files), "Changed path set differs"
            assert all(status in ("added","modified") for status in changed.values()), "Deletion or rename detected"
            print("PASS: verified signature, exact tested tree, exact parent, 13 source paths, no deletes, no force, no main mutation")
            
          PY
