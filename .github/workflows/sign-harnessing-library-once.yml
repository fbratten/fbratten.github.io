name: One-time Harnessing Library signed transfer
on:
  push:
    branches: [chatgpt/harnessing-library-signing-20261107]
permissions:
  contents: write
concurrency:
  group: harnessing-library-signed-20261107
  cancel-in-progress: false
jobs:
  sign-exact-tree:
    if: github.repository == 'fbratten/fbratten.github.io' && github.ref == 'refs/heads/chatgpt/harnessing-library-signing-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f34378b80854481f9e46ef440a70ffd6e266ff5a
          persist-credentials: false
      - name: Sign and verify the exact 18-file projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,subprocess,urllib.request,time
          from pathlib import Path
          repo="fbratten/fbratten.github.io"
          source="f34378b80854481f9e46ef440a70ffd6e266ff5a"
          tree="e1a16b259c7fa901ce70e0d899fec7f9f0a58ab8"
          base="c4a7fb61cbb3ba95e4b52bb6254292743f9343fd"
          target="chatgpt/harnessing-library-signed-20261107"
          paths=["sitemap.xml","tests/harnessing_library_page.mjs","tests/harnessing_library_contract.py","harnessing/index.html","harnessing/README.md","scripts/build_preview.py","scripts/build_navigation.py","all-pages/index.html","methods/index.html","archived/harnessing-publication-20261107/manifest.json","archived/harnessing-publication-20261107/README.md","archived/harnessing-publication-20261107/sitemap.xml.txt","archived/harnessing-publication-20261107/scripts/build_navigation.py.txt","archived/harnessing-publication-20261107/scripts/build_preview.py.txt","archived/harnessing-publication-20261107/all-pages/index.html.txt","archived/harnessing-publication-20261107/methods/index.html.txt","archived/harnessing-publication-20261107/.github/workflows/pages-browser-check.yml.txt",".github/workflows/pages-browser-check.yml"]
          git=lambda *a:subprocess.check_output(["git",*a],text=True).strip()
          assert os.environ["GITHUB_REPOSITORY"]==repo
          assert os.environ["GITHUB_REF"]=="refs/heads/chatgpt/harnessing-library-signing-20261107"
          assert git("rev-parse","HEAD")==source
          assert git("rev-parse","HEAD^{tree}")==tree
          assert len(paths)==len(set(paths))==18
          def api(url,body=None):
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"harnessing-library-signed-transfer"}
              if body is not None:headers["Content-Type"]="application/json"
              req=urllib.request.Request(url,headers=headers,data=json.dumps(body).encode() if body is not None else None,method="POST" if body is not None else "GET")
              with urllib.request.urlopen(req,timeout=90) as r:return json.load(r)
          assert api("https://api.github.com/repos/"+repo+"/branches/main")["commit"]["sha"]==base,"Canonical main moved"
          body={"query":"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}","variables":{"input":{"branch":{"repositoryNameWithOwner":repo,"branchName":target},"message":{"headline":"Publish interactive Harnessing Library","body":"Exact reviewed 18-file projection. All source archives and existing routes preserved."},"expectedHeadOid":base,"fileChanges":{"additions":[{"path":p,"contents":base64.b64encode(Path(p).read_bytes()).decode()} for p in paths]}}}}
          result=api("https://api.github.com/graphql",body)
          assert not result.get("errors"),result.get("errors")
          sha=result["data"]["createCommitOnBranch"]["commit"]["oid"]
          for i in range(8):
              commit=api("https://api.github.com/repos/"+repo+"/commits/"+sha)
              if commit["commit"]["verification"]["verified"]:break
              time.sleep(2)
          assert commit["commit"]["verification"]["verified"],"Signature not verified"
          assert commit["commit"]["tree"]["sha"]==tree,"Tree differs"
          assert [p["sha"] for p in commit["parents"]]==[base],"Parent differs"
          cumulative=api("https://api.github.com/repos/"+repo+"/compare/c4a7fb61cbb3ba95e4b52bb6254292743f9343fd..."+sha)
          assert {f["filename"] for f in cumulative["files"]}==set(paths),"Pathset differs"
          assert all(f["status"] in ["added","modified"] for f in commit["files"]),"Unexpected removal or rename"
          print("PASS: signed identical 18-file tree, exact parent, no removed files",sha)
          PY
