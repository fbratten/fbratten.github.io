name: Pages interaction checks

on:
  pull_request:
    paths:
      - "index.html"
      - "README.md"
      - "methods/**"
      - "tests/**"
      - ".github/workflows/pages-browser-check.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static copy and Canvas regression lint
        run: python tests/site_copy_and_canvas_lint.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Pages server
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/pages-server.log 2>&1 &
          echo $! > /tmp/pages-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pages-server.log
          exit 1

      - name: Exercise method Canvas interactions locally
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/method_interactions.mjs

      - name: Wait for the merged GitHub Pages build
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected='Building AI systems that can be inspected, governed and used in practice'
          for attempt in {1..60}; do
            page="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "https://fbratten.github.io/?build=${GITHUB_SHA}-${attempt}" || true)"
            if grep --fixed-strings --quiet "$expected" <<< "$page"; then
              echo "The expected GitHub Pages build is externally visible."
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation: attempt ${attempt}/60"
            sleep 10
          done
          echo "The expected root-page content did not become visible within 10 minutes."
          exit 1

      - name: Exercise live GitHub Pages interactions
        if: github.event_name == 'push'
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/method_interactions.mjs

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/pages-server.log || true

      - name: Publish live acceptance commit status
        if: github.event_name == 'push' && always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Live root and all 10 method interactions passed"
          else
            state="failure"
            description="Live GitHub Pages acceptance failed"
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context "pages/live-interactions" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
