name: Pages interaction checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      receipt: ${{ steps.seal.outputs.receipt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run static copy and Canvas regression lint
        run: python tests/site_copy_and_canvas_lint.py

      - name: Validate public Build Log contract
        run: python tests/build_log_contract.py

      - name: Validate navigation, article directory and progress feed
        run: python tests/navigation_contract.py

      - name: Validate Music and Film source, media and policy boundaries
        run: |
          python scripts/build_creative.py --check
          python tests/creative_contract.py

      - name: Validate Harnessing Library content and public boundary
        run: python tests/harnessing_library_contract.py

      - name: Check generated English atlas
        run: python scripts/build_atlas_english.py --check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate argumentation and agent teaching models
        run: node tests/aristotle_agents_model.cjs

      - name: Verify English graph identity and experiment parity
        run: node tests/atlas_localization_contract.cjs

      - name: Install Playwright
        run: |
          npm ci --ignore-scripts
          npm run vendor
          git diff --exit-code -- assets/vendor
          npx playwright install --with-deps chromium

      - name: Stage the tracked public source
        run: |
          mkdir _pages_source
          git archive HEAD | tar -x -C _pages_source
      - name: Build the Pages site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_pages_source
          destination: ./_site
      - name: Apply the browser policy and record tested bytes
        id: seal
        run: |
          cp -R _site "$RUNNER_TEMP/pages-site"
          receipt=$(python scripts/pages_release.py seal "$RUNNER_TEMP/pages-site" "$GITHUB_SHA")
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Start local Pages server
        shell: bash
        run: |
          python -m http.server 4173 --directory "$RUNNER_TEMP/pages-site" --bind 127.0.0.1 > /tmp/pages-server.log 2>&1 &
          echo $! > /tmp/pages-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pages-server.log
          exit 1

      - name: Exercise navigation, mobile routes and article filters
        env:
          BASE_URL: http://127.0.0.1:4173
          NAV_SCREENSHOT_DIR: /tmp/navigation-visuals
        run: node tests/navigation_page.mjs

      - name: Exercise Harnessing Library desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/harnessing_library_page.mjs

      - name: Exercise Music and Film media, mobile and no-JavaScript routes
        env:
          BASE_URL: http://127.0.0.1:4173
          NAV_SCREENSHOT_DIR: /tmp/navigation-visuals
        run: node tests/creative_page.mjs

      - name: Exercise category navigation, large maps and English content
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/portfolio_experience_page.mjs

      - name: Exercise ChangePlane integrity demonstration
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/changeplane_page.mjs

      - name: Exercise Aristotle to agents maps and labs
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/aristotle_agents_page.mjs

      - name: Save navigation visual checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-navigation-visuals
          path: /tmp/navigation-visuals/
          retention-days: 14

      - name: Package static review preview
        if: github.event_name == 'pull_request'
        run: |
          git archive --format=zip HEAD -o /tmp/portfolio-navigation-preview.zip
          python scripts/build_preview.py /tmp/portfolio-navigation-preview.html
          python - <<'PYZIP'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path(os.environ['RUNNER_TEMP']) / 'pages-site'
          with ZipFile('/tmp/portfolio-tested-site.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PYZIP

      - name: Save static review preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-navigation-preview
          path: |
            /tmp/portfolio-navigation-preview.zip
            /tmp/portfolio-navigation-preview.html
            /tmp/portfolio-tested-site.zip
          retention-days: 14

      - name: Exercise Build Log locally
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/build_log_page.mjs

      - name: Exercise method Canvas interactions locally
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/method_interactions.mjs

      - name: Exercise solution explorer locally
        env:
          BASE_URL: http://127.0.0.1:4173
          SCREENSHOT_DIR: /tmp/solution-explorer-visuals
        run: node tests/solution_explorer.mjs

      - name: Exercise CBE profiles and existing lab examples locally
        env:
          BASE_URL: http://127.0.0.1:4173
          CBE_SCREENSHOT_DIR: /tmp/cbe-visuals
        run: node tests/cbe_labs.mjs

      - name: Save CBE visual checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbe-profile-visuals
          path: /tmp/cbe-visuals/
          retention-days: 7

      - name: Save solution atlas visual checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solution-atlas-visuals
          path: /tmp/solution-explorer-visuals/
          retention-days: 7

      - name: Exercise Blueprint authority reader labs locally
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/blueprint_authority_labs.mjs

      - name: Exercise interactive AI testing labs locally
        env:
          BASE_URL: http://127.0.0.1:4173
          LAB_SHOT_DIR: /tmp/ai-testing-lab-visuals
        run: node tests/ai_testing_labs.mjs

      - name: Save AI testing lab visual checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-testing-lab-visuals
          path: /tmp/ai-testing-lab-visuals/
          retention-days: 14

      - name: Exercise Worktrace, script integrity and browser policy
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/pages_security.mjs
      - name: Package exactly the tested Pages tree
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [[ -n "$(find "$RUNNER_TEMP/pages-site" -type l -print -quit)" ]]; then
            echo "The deployable artifact must not contain symbolic links." >&2
            exit 1
          fi
          tar --hard-dereference -C "$RUNNER_TEMP/pages-site" -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload tested Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/pages-server.log || true

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live:
    needs: [verify, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify exact published commit and resource bytes
        env:
          EXPECTED_RECEIPT: ${{ needs.verify.outputs.receipt }}
        run: python3 scripts/pages_release.py verify "$EXPECTED_RECEIPT"
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise live Harnessing Library
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/harnessing_library_page.mjs

      - name: Exercise live navigation and article directory
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/navigation_page.mjs

      - name: Exercise live Build Log
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/build_log_page.mjs

      - name: Exercise live GitHub Pages interactions
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/method_interactions.mjs

      - name: Exercise live Blueprint authority reader labs
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/blueprint_authority_labs.mjs

      - name: Exercise live CBE profiles and lab examples
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/cbe_labs.mjs

      - name: Exercise live interactive AI testing labs
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/ai_testing_labs.mjs

      - name: Verify live Worktrace and browser policy
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/pages_security.mjs

      - name: Verify live Music and Film integration
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/creative_page.mjs

      - name: Verify live ChangePlane demonstration
        env:
          BASE_URL: https://fbratten.github.io
        run: node tests/changeplane_page.mjs

  report-status:
    needs: [verify, deploy, live]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish live acceptance commit status
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ needs.live.result }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Live root, Build Log, methods and Blueprint reader labs passed"
          else
            state="failure"
            description="Live GitHub Pages acceptance failed"
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context "pages/live-interactions" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
