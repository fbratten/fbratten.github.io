name: Sign reviewed Pages security fixes
on:
  push:
    branches: [codex/pages-security-signing-20261109]
permissions: {}
concurrency:
  group: sign-pages-security-20261109
  cancel-in-progress: false
jobs:
  sign-reviewed-content:
    if: github.repository == 'fbratten/fbratten.github.io' && github.ref == 'refs/heads/codex/pages-security-signing-20261109' && github.actor == 'fbratten'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read the exact reviewed revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cbcc77ed7da6372d3d8b070ddd6a311558850e36
          persist-credentials: false
      - name: Sign only the two reviewed trees onto the fresh non-default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error

          config = json.loads('{"repo": "fbratten/fbratten.github.io", "base": "ead28d889d35301c5ac8eebb46fb992c3fc60c3c", "src": "cbcc77ed7da6372d3d8b070ddd6a311558850e36", "tree": "00de42175d4f6ff5d2e8c097f42641246f2d1ce5", "finalTree": "2e97ba292cb47924fc39d84026789878ddc5881c", "paths": [".github/workflows/pages-browser-check.yml", ".gitignore", "README.md", "assets/vendor/CHART-LICENSE.txt", "assets/vendor/COLOR-LICENSE.txt", "assets/vendor/OrbitControls.js", "assets/vendor/THREE-LICENSE.txt", "assets/vendor/chart.umd.js", "assets/vendor/three.module.min.js", "methods/5pp/index.html", "methods/aics/index.html", "methods/dial4/index.html", "methods/dial4p-possibility/index.html", "methods/dial4plus/index.html", "methods/dialectic/index.html", "methods/dialogue-lifecycle/index.html", "methods/hermeneutic-didactic/index.html", "methods/orbit/index.html", "methods/rigvedan/index.html", "package-lock.json", "package.json", "scripts/build_vendor.mjs", "scripts/pages_release.py", "tests/pages_security.mjs", "tests/portfolio_experience_page.mjs", "vertex/index.html", "worktrace/index.html"], "replacements": [["actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4", "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1"], ["actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4", "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0"], ["actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5", "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0"], ["actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4", "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2"], ["actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4", "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1"]], "target": "codex/pages-security-signed-20261109", "bridge": "codex/pages-security-signing-20261109", "sourceBranch": "codex/pages-security-20261109", "workflow": ".github/workflows/pages-browser-check.yml"}')
          repo = config["repo"]
          base = config["base"]
          source = config["src"]
          target = config["target"]
          paths = config["paths"]
          api = "https://api.github.com/repos/" + repo


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def request(url, data=None):
              headers = {"Accept": "application/vnd.github+json",
                         "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                         "User-Agent": "reviewed-pages-signature-transfer"}
              payload = None
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  payload = json.dumps(data).encode()
              req = urllib.request.Request(url, data=payload, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  message = json.loads(error.read()).get("message", str(error))
                  raise RuntimeError(f"GitHub HTTP {error.code}: {message}") from None


          def git(*args):
              return subprocess.check_output(["git", *args])


          def current_branch(branch):
              return request(api + "/branches/" + branch)["commit"]["sha"]


          def compare(left, right, expected):
              response = request(api + "/compare/" + left + "..." + right)
              files = response["files"]
              require(len(files) == len(expected) and {f["filename"] for f in files} == set(expected),
                      "Comparison changed files outside the exact approved set")
              require(all(f["status"] in ("added", "modified") for f in files), "Unexpected file removal")
              return response


          def transfer(parent, additions, title, expected_tree):
              require(current_branch("main") == base, "main moved")
              require(current_branch(config["sourceBranch"]) == source, "PR 64 head moved")
              require(current_branch(target) == parent, "Signing target moved")
              mutation = """mutation Sign($input:CreateCommitOnBranchInput!) {
                createCommitOnBranch(input:$input) {commit {oid}} }"""
              body = {"branch": {"repositoryNameWithOwner": repo, "branchName": target},
                      "expectedHeadOid": parent, "message": {"headline": title},
                      "fileChanges": {"additions": [{"path": k, "contents": base64.b64encode(v).decode()}
                                                    for k, v in additions.items()]}}
              result = request("https://api.github.com/graphql",
                               {"query": mutation, "variables": {"input": body}})
              require(not result.get("errors"), str(result.get("errors", ""))[:900])
              sha = result["data"]["createCommitOnBranch"]["commit"]["oid"]
              record = request(api + "/commits/" + sha)
              require(record["commit"]["verification"]["verified"], "Signature was not verified")
              require([p["sha"] for p in record["parents"]] == [parent], "Unexpected commit parent")
              require(record["commit"]["tree"]["sha"] == expected_tree, "Signed content differs")
              compare(parent, sha, list(additions))
              print(f"Verified {sha} tree {expected_tree}, {len(additions)} reviewed paths", flush=True)
              return sha


          require(os.environ["GITHUB_REPOSITORY"] == repo and
                  os.environ["GITHUB_REF"] == "refs/heads/" + config["bridge"], "Wrong invocation")
          require(git("rev-parse", "HEAD").decode().strip() == source, "Wrong source commit")
          require(git("rev-parse", "HEAD^{tree}").decode().strip() == config["tree"], "Wrong source tree")
          require(current_branch(target) == base, "One-time signing target has already advanced")
          require(len(paths) == len(set(paths)) == 27, "Wrong path manifest")
          compare(base, source, paths)
          contents = {}
          for path in paths:
              entry = git("ls-tree", source, "--", path).split(None, 3)
              require(entry[:2] == [b"100644", b"blob"], "Unexpected file mode")
              contents[path] = git("show", source + ":" + path)

          wf = config["workflow"]
          updated = contents[wf].decode()
          for before, after in config["replacements"]:
              require(before in updated, "Expected Actions pin missing: " + before)
              updated = updated.replace(before, after)
          second = updated.encode()
          require(hashlib.sha256(second).hexdigest() == 'd6b62229c90dddb0af3fac37f33c167063a1b2b1fa079c0fa6162169ff9560b3', "Action pin bytes differ")
          first = transfer(base, contents, "Gate Pages deployment on the verified artifact and harden browser scripts",
                           config["tree"])
          last = transfer(first, {wf: second}, "Update pinned Pages Actions to their Node.js 24 runtimes",
                          config["finalTree"])
          compare(base, last, paths)
          print("PASS: both signatures, exact trees, linear ancestry and 27-file scope")
          PYTHON
